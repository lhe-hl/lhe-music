<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>最伟大的作品 - 周杰伦</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "PingFang SC", "微软雅黑", sans-serif;
    }

    body {
      background-color: #f8f8f8;
      padding: 20px;
    }

    audio {
      width: 100%;
      margin-bottom: 30px;
      outline: none;
    }

    .lyric-container {
      width: 100%;
      height: 450px;
      background-color: #fff;
      border-radius: 12px;
      padding: 20px;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .lyric-line {
      font-size: 16px;
      line-height: 2.2;
      text-align: center;
      color: #666;
      transition: all 0.3s ease;
    }

    .lyric-line.active {
      color: #c22837;
      font-size: 18px;
      font-weight: bold;
    }

    .lyric-container::-webkit-scrollbar {
      width: 0;
    }
  </style>
</head>

<body>
  <audio id="audioPlayer" src="../music/周杰伦 - 最伟大的作品_L.mp3" controls loop></audio>
  <div class="lyric-container" id="lyricContainer"></div>

      "[01:19.60] 飘洋过海的乡愁种在一无所有的温柔",
      "[01:25.00] 寂寞的枝头才能长出 常玉要的花朵",

      "[01:33.60] 马蒂斯的海岸", // 纠正：是“马蒂斯”而非“马谛斯”

      "[02:44.00] 日出在印象的港口来回",

      "[03:28.00] 巴黎的鳞爪",
      "[03:30.60] 感伤的文法",
      "[03:33.00] 要用音乐翻阅",
      "[03:35.60] 晚风的灯下",
      "[03:38.00] 旅人的花茶",
      "[03:40.60] 我换成了咖啡",
      "[03:43.00] 之后他就",
      "[03:44.60] 爱上了苦涩这个复杂词汇",
      "[03:49.00] 因为这才是挥手",
      "[03:51.60] 向云彩道别的滋味",
      "[03:54.00] 口袋剩下了一些",
      "[03:56.60] 没用完的诗句",
      "[03:59.00] 先交给了",
      "[04:00.60] 时间去整理",
      "[04:03.00] 笔尖在芸芸众生",
      "[04:05.60] 又写下了新的诗句",
      "[04:10.00] 世代的狂",
      "[04:11.60] 音乐的王",
      "[04:13.00] 万物臣服在我乐章",
      "[04:16.00] 路还在闯",
      "[04:17.60] 我还在创",
      "[04:19.00] 指尖的旋律在渴望",
      "[04:22.00] 世代的狂",
      "[04:23.60] 音乐的王",
      "[04:25.00] 我想我不需要画框",
      "[04:28.00] 它框不住",
      "[04:29.60] 琴键的速度",
      "[04:31.00] 我的音符",
      "[04:32.60] 全部是未来艺术",
      "[04:38.00] 我用琴键穿梭 1920错过的不朽",
      "[04:45.00] 我用琴键穿梭 1920错过的不朽"
    ];

    const audio = document.getElementById('audioPlayer');
    const lyricContainer = document.getElementById('lyricContainer');
    let lyricElements = [];

    // 初始化歌词渲染
    function initLyrics() {
      lyricContainer.innerHTML = '';
      lyricElements = [];

      lyrics.forEach(lyricLine => {
        const timeMatch = lyricLine.match(/\[(\d+):(\d+)\.(\d+)\]/);
        if (!timeMatch) return;

        // 转换时间戳为秒（精准计算）
        const minutes = parseInt(timeMatch[1]);
        const seconds = parseInt(timeMatch[2]);
        const ms = parseInt(timeMatch[3]);
        const timeInSeconds = minutes * 60 + seconds + ms / 100;

        // 提取纯歌词内容
        const lyricText = lyricLine.replace(/\[(\d+):(\d+)\.(\d+)\]/, '').trim();

        // 创建歌词DOM元素
        const lyricDiv = document.createElement('div');
        lyricDiv.className = 'lyric-line';
        lyricDiv.textContent = lyricText;
        lyricDiv.dataset.time = timeInSeconds;
        lyricContainer.appendChild(lyricDiv);
        lyricElements.push(lyricDiv);
      });
    }

    // 实时高亮当前歌词 + 滚动跟随
    function highlightCurrentLyric() {
      const currentTime = audio.currentTime;
      let activeIndex = -1;

      // 精准匹配当前播放时间对应的歌词（预留0.1秒缓冲）
      for (let i = 0; i < lyricElements.length; i++) {
        const lyricTime = parseFloat(lyricElements[i].dataset.time);
        if (i < lyricElements.length - 1) {
          const nextLyricTime = parseFloat(lyricElements[i + 1].dataset.time);
          if (currentTime >= lyricTime - 0.1 && currentTime < nextLyricTime - 0.1) {
            activeIndex = i;
            break;
          }
        } else {
          if (currentTime >= lyricTime - 0.1) {
            activeIndex = i;
            break;
          }
        }
      }

      // 高亮当前歌词 + 平滑滚动到中间
      lyricElements.forEach((el, index) => {
        el.classList.remove('active');
        if (index === activeIndex) {
          el.classList.add('active');
          el.scrollIntoView({
            behavior: 'smooth',
            block: 'center'
          });
        }
      });
    }

    // 页面加载初始化
    window.onload = function () {
      initLyrics();
      // 监听音频播放进度，实时更新歌词
      audio.addEventListener('timeupdate', highlightCurrentLyric);
    };
  </script>
</body>

</html>
